services:
  db:
    image: postgres:16                                         # (1)
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data                       # (2)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]   # (3)
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend                                           # (4)
    env_file: .env                                             # (5)
    ports:
      - "${API_PORT}:3000"                                     # (6)
    depends_on:
      db:
        condition: service_healthy                             # (7)

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:                                                     # (8)
